name: Release-Linux
on:
  push:
    tags:
      - 'v*'

jobs:
  build-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hydrus
      -
        name: Extract Version Metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF##*/}" >> $GITHUB_ENV
          echo "version_short=${GITHUB_REF##*/v}" >> $GITHUB_ENV
      -
        name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: x64
      -
        name: APT Install
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv2
      -
        name: Pip Install
        run: |
          cd hydrus
          python3 -m pip install .
          python3 -m pip install pyinstaller==6.22.3
          python3 -m pip install mkdocs-material==9.7.7
          cd ..
      -
        name: Build docs to /help
        run: mkdocs build -d help -f mkdocs-offline.yml
        working-directory: hydrus
      -
        name: Download and Extract FFmpeg
        run: |
          curl -L -o ffmpeg.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-21-13-06/ffmpeg-N-127900-ge2798d5cad-linux64-gpl.tar.xz"
          tar -xv --file ffmpeg.tar.xz --wildcards --strip-components=2 --directory hydrus/bin '*/bin/ffmpeg'
          chmod +x hydrus/bin/ffmpeg
      -
        name: Build Hydrus
        run: |
          cp hydrus/static/build_files/linux/hydrus.spec hydrus.spec
          pyinstaller hydrus.spec
      -
        name: Remove Surplus File
        run: |
          rm -f "dist/Hydrus Network/"libxkbcommon.so*
      -
        name: Set Permissions
        run: |
          sudo find dist -type d -exec chmod 0755 {} \;
      -
        name: Compress Client
        run: |
          tar --zstd -cvf Hydrus.Network.${{ env.version_short }}.-.Linux.-.Executable.tar.zst -C dist "Hydrus Network"
      - 
        name: Upload Files
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Hydrus.Network.${{ env.version_short }}.-.Linux.-.Executable.tar.zst
