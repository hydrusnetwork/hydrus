name: Release-Linux
on:
  push:
    tags:
      - 'v*'

jobs:
  build-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: hydrus
      -
        name: Extract Version Metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF##*/}" >> $GITHUB_ENV
          echo "version_short=${GITHUB_REF##*/v}" >> $GITHUB_ENV
      -
        name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
      -
        name: APT Install
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv2
      -
        name: Pip Install
        run: |
          cd hydrus
          python3 -m pip install .
          python3 -m pip install pyinstaller==6.18.0
          python3 -m pip install mkdocs-material==9.7.1
          cd ..
      -
        name: Build docs to /help
        run: mkdocs build -d help -f mkdocs-offline.yml
        working-directory: hydrus
      -
        name: Download and Extract FFmpeg
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-06-30-13-34/ffmpeg-N-125365-g9a01c1cb6a-linux64-gpl.tar.xz" -OutFile "ffmpeg.tar.xz"
          tar -xv --file ffmpeg.tar.xz --wildcards --strip-components=2 --directory hydrus/bin '*/bin/ffmpeg'
      -
        name: Build Hydrus
        run: |
          cp hydrus/static/build_files/linux/hydrus.spec hydrus.spec
          pyinstaller hydrus.spec
      -
        name: Remove Surplus File
        run: |
          rm -f "dist/Hydrus Network/"libxkbcommon.so*
      -
        name: Set Permissions
        run: |
          sudo find dist -type d -exec chmod 0755 {} \;
      -
        name: Compress Client
        run: |
          tar --zstd -cvf Hydrus.Network.${{ env.version_short }}.-.Linux.-.Executable.tar.zst -C dist "Hydrus Network"
      - 
        name: Upload Files
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Hydrus.Network.${{ env.version_short }}.-.Linux.-.Executable.tar.zst
